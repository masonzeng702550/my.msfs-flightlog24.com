name: Build and deploy logbook

on:
  push:
    branches: [main]
    paths:
      - "recordings/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      full_reparse:
        description: "Re-parse every recording from scratch"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # recordings/ is ~2.3 GB, so don't pull it just to ship a CSS tweak:
      # blobless + sparse checkout fetches file contents only for what we list,
      # and the recordings we actually need are added back in below.
      - name: Checkout (without recordings)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            site
            scripts
            .github
          sparse-checkout-cone-mode: true

      - name: Work out which recordings changed
        id: scope
        run: |
          set -euo pipefail
          # every recording in the repo — tree data only, no file contents
          git ls-tree -r --name-only HEAD recordings/ > /tmp/inventory.txt || true
          echo "total=$(grep -c '\.fltrec$' /tmp/inventory.txt || true)" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ inputs.full_reparse }}" = "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a parser change invalidates every cached flight
          if git diff --name-only HEAD^ HEAD -- scripts/ | grep -q .; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD -- recordings/ > /tmp/changed.txt || true
          if grep -q '\.fltrec$\|\.meta\.yml$' /tmp/changed.txt; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch only the changed recordings
        if: steps.scope.outputs.mode == 'changed'
        run: |
          set -euo pipefail
          # a .meta.yml edit must also pull its .fltrec so the pair can be re-parsed
          sed 's/\.meta\.yml$/.fltrec/' /tmp/changed.txt | sort -u > /tmp/want.txt
          echo "Fetching $(wc -l < /tmp/want.txt) recording(s):"; cat /tmp/want.txt
          # Cone mode only understands directories, so naming individual files
          # fails outright ("is not a directory"). Restate the whole sparse set
          # in non-cone mode, where a pattern can be an exact path.
          { printf '/site/\n/scripts/\n/.github/\n'; sed 's|^|/|' /tmp/want.txt; } > /tmp/sparse.txt
          git sparse-checkout set --no-cone --stdin < /tmp/sparse.txt
          ls -la recordings/ | head

      - name: Fetch all recordings
        if: steps.scope.outputs.mode == 'all'
        run: git sparse-checkout add recordings

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.mode != 'none'
        with:
          python-version: "3.12"

      - name: Parse recordings into site data
        if: steps.scope.outputs.mode != 'none'
        run: |
          python3 scripts/parse_recordings.py \
            --inventory /tmp/inventory.txt \
            ${{ steps.scope.outputs.mode == 'all' && '--full' || '' }}

      - name: Skip parsing
        if: steps.scope.outputs.mode == 'none'
        run: echo "No recordings changed — deploying the committed site/data as-is."

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
